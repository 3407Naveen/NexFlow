version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexflow-postgres
    environment:
      POSTGRES_USER: nexflow
      POSTGRES_PASSWORD: nexflow_dev_pass
      POSTGRES_DB: nexflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: nexflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexflow_access
      MINIO_ROOT_PASSWORD: nexflow_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexflow-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://nexflow:nexflow_dev_pass@postgres:5432/nexflow
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=nexflow_access
      - S3_SECRET_KEY=nexflow_secret
      - S3_BUCKET=nexflow-files
      - SECRET_KEY=dev-secret-key-change-in-production-min-32-chars
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - ENVIRONMENT=development
      - DEBUG=true
      - DEMO_MODE=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexflow-worker
    command: arq app.workers.worker.WorkerSettings
    environment:
      - DATABASE_URL=postgresql+asyncpg://nexflow:nexflow_dev_pass@postgres:5432/nexflow
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=nexflow_access
      - S3_SECRET_KEY=nexflow_secret
      - S3_BUCKET=nexflow-files
      - SECRET_KEY=dev-secret-key-change-in-production-min-32-chars
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - ENVIRONMENT=development
      - DEBUG=true
      - DEMO_MODE=true
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
